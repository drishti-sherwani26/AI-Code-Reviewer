<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quiz | AI Code Reviewer</title>

    <link rel="stylesheet" href="quiz.css">
</head>

<body>

<!-- NAVBAR -->

<nav class="navbar">

    <div class="logo">
        AI Code Reviewer
    </div>

    <ul class="nav-links">

        <li><a href="home.html">Home</a></li>
        <li><a href="index.html">Compiler</a></li>
        <li><a href="ai-chatbot.html">AI Guide</a></li>
        <li><a href="quiz.html" class="active">Quiz</a></li>
        <li><a href="about.html">About</a></li>

    </ul>

</nav>


<!-- QUIZ START SCREEN -->

<section id="start-screen" class="screen">

    <div class="quiz-card">

        <div class="robot">
            🤖
        </div>

        <h1>
            Coding Quiz
        </h1>

        <p>
            Test your programming knowledge
            and improve your coding skills.
        </p>


        <h2>
            Choose a Programming Language
        </h2>


        <div class="language-options">

            <button onclick="selectLanguage('C')">
                C
            </button>

            <button onclick="selectLanguage('Java')">
                Java
            </button>

            <button onclick="selectLanguage('Python')">
                Python
            </button>

            <button onclick="selectLanguage('JavaScript')">
                JavaScript
            </button>

        </div>


        <button
            id="start-button"
            class="start-button"
            onclick="startQuiz()"
            disabled>

            Start Quiz

        </button>

    </div>

</section>



<!-- QUIZ SCREEN -->

<section id="quiz-screen" class="screen hidden">

    <div class="quiz-container">

        <div class="quiz-top">

            <span id="language-name">
                Python
            </span>

            <span id="question-number">
                Question 1 / 5
            </span>

        </div>


        <div class="progress-bar">

            <div id="progress"></div>

        </div>


        <div class="question-card">

            <h2 id="question">
                Question goes here
            </h2>


            <div id="answers" class="answers">

            </div>


            <button
                id="next-button"
                onclick="nextQuestion()"
                disabled>

                Next

            </button>

        </div>

    </div>

</section>



<!-- RESULT SCREEN -->

<section id="result-screen" class="screen hidden">

    <div class="result-card">

        <div class="robot">
            🤖
        </div>

        <h1>
            Quiz Completed!
        </h1>

        <p>
            Your Score
        </p>

        <div id="score">
            0 / 5
        </div>

        <p id="result-message">
            Good job!
        </p>

        <button
            class="start-button"
            onclick="restartQuiz()">

            Try Again

        </button>

    </div>

</section>


<script src="quiz.js"></script>

</body>

</html>
