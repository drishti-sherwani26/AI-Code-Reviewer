<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>AI Code Assistant</title>

    <style>

        /* =========================
           RESET
        ========================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        /* =========================
           BODY
        ========================= */

        body {

            min-height: 100vh;

            background: #0F172A;

            color: #E2E8F0;

            font-family: Arial, sans-serif;

        }


        /* =========================
           MAIN PAGE
        ========================= */

        .page {

            min-height: 100vh;

            display: flex;

            flex-direction: column;

            align-items: center;

            padding: 40px 20px;

        }


        /* =========================
           ROBOT CONTAINER
        ========================= */

        .robot-container {

            width: 300px;

            height: 300px;

            position: relative;

            display: flex;

            justify-content: center;

            align-items: center;

            margin-bottom: 10px;

        }


        /* =========================
           ROBOT
        ========================= */

        .robot {

            position: relative;

            width: 240px;

            height: 270px;

            animation: robotFloat 3s ease-in-out infinite;

        }


        /* =========================
           ANTENNA
        ========================= */

        .antenna {

            position: absolute;

            top: 0;

            left: 50%;

            transform: translateX(-50%);

            width: 6px;

            height: 40px;

            background: #94A3B8;

            border-radius: 10px;

            z-index: 5;

        }


        .antenna-light {

            position: absolute;

            width: 20px;

            height: 20px;

            border-radius: 50%;

            top: -12px;

            left: 50%;

            transform: translateX(-50%);

            background: #3B82F6;

            box-shadow:

                0 0 10px #3B82F6,

                0 0 25px #3B82F6;

        }


        /* =========================
           HEAD
        ========================= */

        .robot-head {

            position: absolute;

            top: 30px;

            left: 50%;

            transform: translateX(-50%);

            width: 205px;

            height: 140px;

            background: linear-gradient(
                145deg,
                #ffffff,
                #dbeafe
            );

            border-radius: 50px;

            border: 3px solid #CBD5E1;

            box-shadow:

                0 10px 30px
                rgba(0,0,0,0.4),

                0 0 25px
                rgba(59,130,246,0.2);

            z-index: 3;

        }


        /* =========================
           FACE
        ========================= */

        .robot-face {

            position: absolute;

            width: 155px;

            height: 92px;

            left: 50%;

            top: 22px;

            transform: translateX(-50%);

            background: #020617;

            border-radius: 40px;

            border: 3px solid #334155;

        }


        /* =========================
           EYES
        ========================= */

        .robot-eye {

            position: absolute;

            width: 20px;

            height: 28px;

            top: 27px;

            background: #22D3EE;

            border-radius: 50%;

            box-shadow:

                0 0 10px #22D3EE,

                0 0 20px #22D3EE;

        }


        .robot-eye.left {

            left: 35px;

        }


        .robot-eye.right {

            right: 35px;

        }


        /* =========================
           SMILE
        ========================= */

        .robot-smile {

            position: absolute;

            width: 32px;

            height: 15px;

            left: 50%;

            bottom: 18px;

            transform: translateX(-50%);

            border-bottom: 4px solid #22D3EE;

            border-radius: 50%;

        }


        /* =========================
           EARS
        ========================= */

        .robot-ear {

            position: absolute;

            top: 70px;

            width: 32px;

            height: 60px;

            background: #CBD5E1;

            border: 3px solid #64748B;

            border-radius: 15px;

            z-index: 2;

        }


        .left-ear {

            left: 5px;

        }


        .right-ear {

            right: 5px;

        }


        .robot-ear::after {

            content: "";

            position: absolute;

            width: 10px;

            height: 28px;

            top: 13px;

            left: 8px;

            background: #3B82F6;

            border-radius: 10px;

            box-shadow:

                0 0 10px #3B82F6;

        }


        /* =========================
           NECK
        ========================= */

        .robot-neck {

            position: absolute;

            width: 70px;

            height: 35px;

            background: #94A3B8;

            top: 160px;

            left: 50%;

            transform: translateX(-50%);

            border-radius: 0 0 15px 15px;

            z-index: 1;

        }


        /* =========================
           BODY
        ========================= */

        .robot-body {

            position: absolute;

            width: 165px;

            height: 120px;

            top: 175px;

            left: 50%;

            transform: translateX(-50%);

            background: linear-gradient(
                145deg,
                #ffffff,
                #dbeafe
            );

            border-radius: 45px 45px 55px 55px;

            border: 3px solid #CBD5E1;

            box-shadow:

                0 10px 25px
                rgba(0,0,0,0.35);

            z-index: 2;

        }


        /* =========================
           CHEST
        ========================= */

        .chest-panel {

            position: absolute;

            width: 70px;

            height: 65px;

            left: 50%;

            top: 25px;

            transform: translateX(-50%);

            background: #2563EB;

            border-radius: 20px;

            display: flex;

            justify-content: center;

            align-items: center;

            box-shadow:

                0 0 20px
                rgba(37,99,235,0.6);

        }


        .chat-icon {

            font-size: 30px;

        }


        /* =========================
           ARMS
        ========================= */

        .robot-arm {

            position: absolute;

            width: 42px;

            height: 100px;

            top: 175px;

            background: linear-gradient(
                145deg,
                #ffffff,
                #bfdbfe
            );

            border: 3px solid #CBD5E1;

            border-radius: 30px;

            z-index: 1;

        }


        .left-arm {

            left: 12px;

            transform: rotate(15deg);

        }


        .right-arm {

            right: 12px;

            transform: rotate(-15deg);

        }


        /* =========================
           ROBOT FLOAT
        ========================= */

        @keyframes robotFloat {

            0% {

                transform: translateY(0);

            }

            50% {

                transform: translateY(-10px);

            }

            100% {

                transform: translateY(0);

            }

        }


        /* =========================
           HEADING
        ========================= */

        h1 {

            font-size: 32px;

            color: #F8FAFC;

            text-align: center;

            margin-bottom: 10px;

        }


        .intro {

            color: #94A3B8;

            text-align: center;

            font-size: 15px;

            margin-bottom: 25px;

        }


        /* =========================
           CHAT BOX
        ========================= */

        .chat-box {

            width: 700px;

            max-width: 100%;

            height: 430px;

            background: #1E293B;

            border: 1px solid #334155;

            border-radius: 18px;

            overflow: hidden;

            display: flex;

            flex-direction: column;

            box-shadow:

                0 15px 50px
                rgba(0,0,0,0.4);

        }


        /* =========================
           MESSAGES
        ========================= */

        .messages {

            flex: 1;

            padding: 20px;

            overflow-y: auto;

            display: flex;

            flex-direction: column;

            gap: 15px;

        }


        .bot-message {

            display: flex;

            gap: 12px;

            max-width: 80%;

            background: #334155;

            padding: 14px;

            border-radius:
                14px 14px 14px 4px;

            font-size: 13px;

            line-height: 1.6;

        }


        .message-robot {

            font-size: 22px;

        }


        .bot-message strong {

            color: white;

        }


        .bot-message p {

            margin-top: 5px;

            color: #CBD5E1;

        }


        .user-message {

            align-self: flex-end;

            max-width: 80%;

            background: #3B82F6;

            color: white;

            padding: 12px 15px;

            border-radius:
                14px 14px 4px 14px;

            font-size: 13px;

        }


        /* =========================
           INPUT
        ========================= */

        .input-container {

            display: flex;

            gap: 10px;

            padding: 15px;

            background: #16213A;

            border-top: 1px solid #334155;

        }


        #user-input {

            flex: 1;

            height: 50px;

            resize: none;

            outline: none;

            border: 1px solid #334155;

            border-radius: 10px;

            background: #0F172A;

            color: white;

            padding: 13px;

            font-family: Arial, sans-serif;

            font-size: 13px;

        }


        #user-input:focus {

            border-color: #3B82F6;

        }


        #send-button {

            width: 50px;

            height: 50px;

            border: none;

            border-radius: 10px;

            background: #22C55E;

            color: white;

            font-size: 20px;

            cursor: pointer;

        }


        #send-button:hover {

            background: #16A34A;

        }


        .input-hint {

            padding: 0 15px 12px;

            background: #16213A;

            color: #64748B;

            font-size: 10px;

            text-align: center;

        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            .page {

                padding: 20px 15px;

            }


            h1 {

                font-size: 25px;

            }


            .robot-container {

                transform: scale(0.8);

                margin-bottom: -20px;

            }


            .chat-box {

                height: 450px;

            }

        }

    </style>

</head>


<body>


    <div class="page">


        <!-- ROBOT -->

        <div class="robot-container">

            <div class="robot">

                <div class="antenna">

                    <div class="antenna-light"></div>

                </div>


                <div class="robot-head">

                    <div class="robot-face">

                        <div class="robot-eye left"></div>

                        <div class="robot-eye right"></div>

                        <div class="robot-smile"></div>

                    </div>

                </div>


                <div class="robot-ear left-ear"></div>

                <div class="robot-ear right-ear"></div>


                <div class="robot-neck"></div>


                <div class="robot-body">

                    <div class="chest-panel">

                        <div class="chat-icon">
                            💬
                        </div>

                    </div>

                </div>


                <div class="robot-arm left-arm"></div>

                <div class="robot-arm right-arm"></div>

            </div>

        </div>


        <!-- TITLE -->

        <h1>
            Hi! I'm here to help you 😊 
        </h1>


        <p class="intro">

            Tell me what problem you're facing
            and I'll help you solve it.

        </p>


        <!-- CHAT -->

        <div class="chat-box">


            <div class="messages" id="messages">


                <div class="bot-message">

                    <div class="message-robot">
                        🤖
                    </div>

                    <div>

                        <strong>
                            AI Assistant
                        </strong>

                        <p>

                            Hi! What would you like
                            to ask me?

                            <br>

                            You can describe your coding
                            problem or paste your code.

                        </p>

                    </div>

                </div>


            </div>


            <div class="input-container">

                <textarea
                    id="user-input"
                    placeholder="Describe your coding problem..."
                ></textarea>


                <button id="send-button">

                    ➤

                </button>

            </div>


            <div class="input-hint">

                Press Enter to send • Shift + Enter
                for a new line

            </div>


        </div>


    </div>

<script src="chatbot.js"></script>


</body>

</html>
